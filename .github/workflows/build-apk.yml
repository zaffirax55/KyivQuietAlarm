name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Probe city status API (non-blocking diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "https://kyiv.digital/open-api/air-alert/state",
              headers={"Accept": "application/json", "User-Agent": "KyivQuietAlarm-test"})
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  raw=response.read(4096).decode("utf-8","replace")
                  print("HTTP", response.status, "type", response.headers.get("Content-Type"))
                  try:
                      obj=json.loads(raw)
                      print("JSON response sample:", json.dumps(obj,ensure_ascii=False)[:1200])
                  except Exception:
                      print("Non-JSON reply", raw[:160])
          except Exception as exc:
              print("Endpoint unavailable:", type(exc).__name__, str(exc)[:240])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KyivQuietAlarm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
