name: Build PC Control Android and Windows
on:
  push:
    branches: [pc-control]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Bundle Windows app
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name PC-Control-Windows windows/agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Control-Windows-EXE
          path: dist/PC-Control-Windows.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Control-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish direct downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested Android and Windows builds
        uses: actions/download-artifact@v4
        with:
          pattern: PC-Control-*
          merge-multiple: true
          path: release-files
      - name: Prepare named downloads and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mv release-files/app-debug.apk release/PC-Control-Android-v1.2.apk
          mv release-files/PC-Control-Windows.exe release/PC-Control-Windows-v1.2.exe
          cd release
          sha256sum PC-Control-Android-v1.2.apk PC-Control-Windows-v1.2.exe > SHA256SUMS.txt
          ls -lah
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create pc-control-v1.2 \
            release/PC-Control-Android-v1.2.apk \
            release/PC-Control-Windows-v1.2.exe \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PC Control v1.2 — Android + Windows" \
            --notes "Комплект для личного управления Windows с Android в одной локальной Wi-Fi сети. Прямые файлы APK и EXE; тестовые сборки без коммерческой подписи. Перед использованием прочитайте README ветки pc-control. Не открывайте порт 43821 в интернет. Wake-on-LAN зависит от оборудования и не гарантирует включение." \
            --latest=false
